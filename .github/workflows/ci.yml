name: Secretless CI & Terraform Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions required for GitHub Actions OIDC token exchange with AWS IAM
permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Terraform, K8s Manifests & Workload Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init (Backend Disabled)
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint & Compile Python Workload
        run: |
          python -m py_compile app/main.py
